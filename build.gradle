plugins {
    id 'java'
    id 'application'
}

group = 'com.fish'
version = 'redev-ALPHA-5'

application {
    applicationName = "Arcaterra"
    mainClass = 'com.fish.arcaterra.Arcaterra'
}

repositories {
    mavenCentral()
}

ext {
    lwjglVersion = "3.4.1"
    jomlVersion = "1.10.8"
    lwjglNatives = "natives-windows"
}

dependencies {
    implementation platform("org.lwjgl:lwjgl-bom:$lwjglVersion")
    implementation "org.lwjgl:lwjgl"
    implementation "org.lwjgl:lwjgl-glfw"
    implementation "org.lwjgl:lwjgl-opengl"
    implementation "org.lwjgl:lwjgl-stb"
    implementation "org.lwjgl:lwjgl::$lwjglNatives"
    implementation "org.lwjgl:lwjgl-glfw::$lwjglNatives"
    implementation "org.lwjgl:lwjgl-opengl::$lwjglNatives"
    implementation "org.lwjgl:lwjgl-stb::$lwjglNatives"

    implementation "org.joml:joml:${jomlVersion}"

    // GeoTools 暂时注释，后续再研究
    // implementation 'org.geotools:gt-geotiff:28.0'
    // implementation 'org.geotools:gt-epsg-hsql:28.0'

    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}


test {
    useJUnitPlatform()
}

jar {
    manifest {
        attributes 'Main-Class': application.mainClass.get()
    }
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

// ========== 修改启动脚本，使用 ../jre/bin/java.exe ==========
startScripts {
    doLast {
        def batFile = file("${outputDir}/${applicationName}.bat")
        def batContent = batFile.text

        // 1. 强制将 JAVA_EXE 指向 ../jre/bin/java.exe
        batContent = batContent.replace(
                'set JAVA_HOME=%JAVA_HOME:"=%',
                'set JAVA_HOME=../jre'
        )

        // 3. 把修改后的内容写回
        batFile.text = batContent
    }
}
